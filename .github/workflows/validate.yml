name: Validate Service Map Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      APP_MODE: client
      VITE_APP_MODE: client
      SESSION_SECRET: validation-only-session-secret-not-used-at-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Typecheck and build production artifacts
        run: pnpm run build:render

      - name: Install Chromium for landing verification
        run: pnpm --filter @workspace/occu-med exec playwright install --with-deps chromium

      - name: Verify globe entrance and sign-in flow
        run: pnpm --filter @workspace/occu-med run test:landing
